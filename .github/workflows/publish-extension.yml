name: Publish browser extension

on:
  push:
    branches:
      - main # Change to master if needed
    paths:
      - 'manifest.json'
  workflow_dispatch:

# Globally secure: Default all tokens to read-only
permissions:
  contents: read

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

env:
  EXTENSION_PACKAGE: cookieedit-plus-plus.zip

jobs:
  package:
    name: Validate, Version Check, and Package
    runs-on: ubuntu-latest
    outputs:
      artifact-name: extension-package
      package-name: ${{ env.EXTENSION_PACKAGE }}
      version-changed: ${{ steps.check-version.outputs.changed }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate manifest JSON
        run: python -m json.tool manifest.json > /tmp/manifest.json

      - name: Extract current version
        id: get-version
        run: |
          VERSION=$(jq -r '.version // empty' manifest.json)
          
          # Fail fast if version is blank or null to prevent corrupting tags
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Invalid or missing version in manifest.json"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: check-version
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            echo "No previous commit context available (dispatch/new branch). Assuming version changed."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Fetching the pre-push base commit: ${{ github.event.before }}"
            git fetch origin ${{ github.event.before }} --depth=1

            # Safely fetch old version context from base commit range
            OLD_VERSION=$(git show ${{ github.event.before }}:manifest.json | jq -r '.version // "none"' 2>/dev/null || echo "none")
            
            # Reuse the strictly validated output version from the previous step
            NEW_VERSION="${{ steps.get-version.outputs.version }}"
            
            if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
              echo "Version changed from $OLD_VERSION to $NEW_VERSION. Proceeding with release."
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "Version did not change across this push range. Skipping publication."
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Package extension zip
        if: steps.check-version.outputs.changed == 'true'
        run: |
          zip -r "$EXTENSION_PACKAGE" \
            manifest.json \
            popup.html \
            popup.css \
            popup.js \
            icons

      - name: Upload package artifact
        if: steps.check-version.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: ${{ env.EXTENSION_PACKAGE }}
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: package
    if: needs.package.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    # Elevate contents permission strictly where needed to cut off top-level risk
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          name: Release v${{ needs.package.outputs.version }}
          body: |
            Automated extension release for version v${{ needs.package.outputs.version }}.
          draft: false
          prerelease: false
          files: ${{ needs.package.outputs.package-name }}

  publish-edge:
    name: Publish to Microsoft Edge Add-ons
    needs: [package, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}

      - name: Publish Edge add-on
        uses: wdzeng/edge-addon@v2
        with:
          product-id: ${{ secrets.EDGE_PRODUCT_ID }}
          zip-path: ${{ needs.package.outputs.package-name }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          client-id: ${{ secrets.EDGE_CLIENT_ID }}

  publish-firefox:
    name: Publish to Mozilla Add-ons
    needs: [package, github-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact-name }}

      - name: Submit Firefox add-on to AMO
        uses: kewisch/action-web-ext@v2
        with:
          cmd: sign
          source: ${{ needs.package.outputs.package-name }}
          channel: listed
          apiKey: ${{ secrets.AMO_SIGN_KEY }}
          apiSecret: ${{ secrets.AMO_SIGN_SECRET }}
          approvalTimeout: 0
