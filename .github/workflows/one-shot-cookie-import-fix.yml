name: Apply cookie import review fix

on:
  push:
    branches:
      - fix/cookie-editor-correctness-ui-v2
    paths:
      - '.github/workflows/one-shot-cookie-import-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply review fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('popup.js')
          s = p.read_text()
          old = "if (original && cookieIdentity(original) !== cookieIdentity(savedCookie)) {"
          new = "if (original && !original.synthetic && cookieIdentity(original) !== cookieIdentity(savedCookie)) {"
          if old not in s:
              raise SystemExit('Expected removal guard not found')
          s = s.replace(old, new, 1)
          old = "          partitionKey\n        },\n        name: cookie.name,"
          new = "          partitionKey,\n          synthetic: true\n        },\n        name: cookie.name,"
          if old not in s:
              raise SystemExit('Expected synthetic import record not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add popup.js
          git commit -m 'fix: do not remove synthetic import records'
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/one-shot-cookie-import-fix.yml
          git add .github/workflows/one-shot-cookie-import-fix.yml
          git commit -m 'chore: remove one-shot review workflow' || true
          git push || true
