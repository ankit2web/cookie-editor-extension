name: Fetch Signed Firefox Asset

on:
  schedule:
    # Runs every 6 hours to check for approval (adjust as needed)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger a check

permissions:
  contents: write

jobs:
  check-and-update:
    name: Poll AMO for Signed XPI
    runs-on: ubuntu-latest
    steps:
      - name: Get Latest GitHub Release Info
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch the latest release tag (e.g., v1.0.4) and strip the 'v' prefix
          TAG=$(gh release view --json tagName -q '.tagName')
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if an XPI asset is already attached to this release
          HAS_XPI=$(gh release view "$TAG" --json assets -q '[.assets[].name | endswith(".xpi")] | any')
          echo "has_xpi=$HAS_XPI" >> $GITHUB_OUTPUT

      - name: Fetch and Check AMO Status
        if: steps.latest_release.outputs.has_xpi != 'true'
        id: amo_check
        run: |
          VERSION="${{ steps.latest_release.outputs.version }}"
          
          # Replace with your extension's actual UUID/Slug from the AMO dashboard
          AMO_SLUG="cookieedit" 
          
          echo "Checking AMO for version $VERSION..."
          RESPONSE=$(curl -s -L -H 'Accept: application/json' "https://addons.mozilla.org/api/v5/addons/addon/$AMO_SLUG/versions/$VERSION/")
          
          # Verify the API response matches our targeted version and extract the signed file URL
          RETURNED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty')
          XPI_URL=$(echo "$RESPONSE" | jq -r '.file.url // empty')
          
          if [ "$RETURNED_VERSION" != "$VERSION" ] || [ -z "$XPI_URL" ] || [ "$XPI_URL" == "null" ]; then
            echo "Version $VERSION is not signed or approved yet on AMO (or version mismatch)."
            echo "approved=false" >> $GITHUB_OUTPUT
          else
            echo "Signed XPI found! Downloading..."
            curl -L -o "cookieedit-plus-plus.xpi" "$XPI_URL"
            echo "approved=true" >> $GITHUB_OUTPUT
          fi

      - name: Attach Signed XPI to GitHub Release
        if: steps.latest_release.outputs.has_xpi != 'true' && steps.amo_check.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.latest_release.outputs.tag }}"
          echo "Uploading signed XPI to release $TAG..."
          gh release upload "$TAG" cookieedit-plus-plus.xpi --clobber